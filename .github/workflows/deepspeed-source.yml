name: deepspeed-source

# DeepSpeed NPU unit tests, modeled on upstream's xpu-max1100.yml.
#
# This workflow is staged in Ascend-CI so it can be exercised on the a2 NPU runners
# before being submitted to deepspeedai/DeepSpeed. To port it upstream, make the
# changes marked with "PORT:" below:
#
#   1. checkout: replace the Ascend-CI self-checkout + the deepspeedai/DeepSpeed
#      subdir checkout with a single plain `uses: actions/checkout@v4`.
#   2. runs-on: use the labels registered for the NPU runners on deepspeedai/DeepSpeed
#      (e.g. [self-hosted, ascend, npu]) instead of the a2 runner names.
#   3. triggers: while staged, this workflow is manual-only (workflow_dispatch).
#      Upstream, restore the trigger block and the event-based job conditions:
#        on:
#          workflow_dispatch:
#          schedule:
#            - cron: "0 0 * * *"
#          push:
#            branches: [master]            # the repo's default branch
#            paths: ['.github/workflows/deepspeed-source.yml']
#          pull_request:
#            paths:  # mirrors xpu-max1100.yml, plus the NPU-specific comm backend
#              - ".github/workflows/deepspeed-source.yml"
#              - "accelerator/npu_accelerator.py"
#              - "accelerator/abstract_accelerator.py"
#              - "accelerator/cpu_accelerator.py"
#              - "accelerator/real_accelerator.py"
#              - "deepspeed/comm/comm.py"
#              - "deepspeed/comm/constants.py"
#              - "deepspeed/runtime/engine.py"
#              - "deepspeed/runtime/bf16_optimizer.py"
#              - "deepspeed/runtime/zero/stage_1_and_2.py"
#              - "deepspeed/runtime/zero/stage3.py"
#              - "deepspeed/runtime/zero/partition_parameters.py"
#              - "deepspeed/runtime/zero/partitioned_param_coordinator.py"
#              - "deepspeed/runtime/zero/parameter_offload.py"
#              - "deepspeed/runtime/pipe/engine.py"
#              - "deepspeed/runtime/utils.py"
#              - "op_builder/npu/**"
#      and switch the job conditions back to:
#        pr-unit-tests: if: github.event_name == 'pull_request'
#        unit-tests:    if: github.event_name != 'pull_request'
#
# Design:
#   - PR runs are non-blocking (continue-on-error only when the event is a PR) and
#     execute a small smoke subset with a short timeout, so PR merges are never held
#     up by NPU jobs.
#   - Nightly runs (schedule + push to the default branch + workflow_dispatch)
#     execute the full suite. They are NOT continue-on-error, so the README badge
#     (generated by GitHub from the latest run on the default branch) reflects real
#     failures.
#   - While staged, pick `suite: smoke` to exercise the PR subset or `suite: full`
#     (default) to exercise the nightly set.

on:
  workflow_dispatch:
    inputs:
      runner:
        required: true
        type: choice
        options:
          - linux-aarch64-a2-1
          - linux-aarch64-a2-2
          - linux-aarch64-a2-4
          - linux-aarch64-a2-8
        default: 'linux-aarch64-a2-1'
        description: 'Runner to run on'
      suite:
        required: true
        type: choice
        options:
          - full
          - smoke
        default: 'full'
        description: 'Suite to run: full (nightly set) or smoke (PR subset)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

jobs:
  pr-unit-tests:
    name: deepspeed-source / pr unit tests
    # Staged: selected with suite=smoke. Upstream: github.event_name == 'pull_request'.
    if: github.event.inputs.suite == 'smoke'
    # PORT: upstream, replace with the NPU self-hosted runner labels.
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-1' }}
    # NPU jobs must never block PR merges: failures are reported, not enforced.
    # Only relax the gate for PR runs; manual dispatch and nightly must surface failures.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config mirrors
        run: |
          sed -i 's|ports.ubuntu.com|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          pip config set global.index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          pip config set global.retries 5

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
              git gcc g++ make cmake ninja-build python-is-python3 python3-pip

      - name: Check container state
        run: |
          npu-smi info
          echo "source /usr/local/Ascend/cann/set_env.sh" >> ~/.bashrc

      - name: Install pytorch
        run: |
          pip install torch torch_npu==2.7.1rc1 torchvision \
              numpy==1.* cloudpickle tornado ml-dtypes PyYAML decorator -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

      - name: List torch_npu version
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import torch_npu; print('torch_npu:', torch_npu.__version__)"

      - name: Install transformers
        run: |
          # Install the PyPI release from the configured tuna mirror instead of
          # cloning transformers master: github.com is unreliable from this
          # runner's network, and master has broken this workflow twice
          # (torchaudio import chain, 'embedding_rowwise' tp_plan style).
          pip install transformers

      - name: Checkout deepspeed
        uses: actions/checkout@v4
        with:
          # PORT: upstream, drop this step (the workflow itself is checked out).
          repository: deepspeedai/DeepSpeed
          path: deepspeed

      - name: Install deepspeed
        working-directory: deepspeed
        run: |
          # Install DeepSpeed's dev requirements (test toolchain) straight from the
          # checkout so they never drift from upstream; drop deepspeed-kernels,
          # which only ships x86_64 wheels and fails on aarch64 NPU runners.
          sed '/deepspeed-kernels/d' requirements/requirements-dev.txt > /tmp/requirements-dev-npu.txt
          pip install -r /tmp/requirements-dev-npu.txt
          pip install .[autotuning]
          ds_report

      - name: Run PR smoke unit tests
        working-directory: deepspeed/tests/unit
        run: |
          unset TORCH_CUDA_ARCH_LIST # only jit compile for current arch

          # test_ds_init.py::test_literal_device hardcodes a device-name whitelist
          # ('xpu'/'cuda'); extend it so the same literal-device check applies on NPU
          sed -i \
            -e "s/string == 'cuda'/string == 'cuda' or string == 'npu'/" \
            -e "s/string0 == 'cuda:0'/string0 == 'cuda:0' or string0 == 'npu:0'/" \
            -e "s/string1 == 'cuda:1'/string1 == 'cuda:1' or string1 == 'npu:1'/" \
            ../accelerator/test_ds_init.py

          # test_ds_init.py passes the literal 'ds_config.json' to deepspeed.initialize,
          # so it must run with cwd = tests/accelerator (no __file__-based path resolution)
          (cd ../accelerator && pytest --verbose .)
          pytest --verbose utils
          pytest --verbose runtime/test_ds_config_model.py
          pytest --verbose runtime/zero/test_zero_config.py
          pytest --verbose runtime/test_data.py

  unit-tests:
    name: deepspeed-source / unit tests
    # Staged: selected with suite=full (default). Upstream: github.event_name != 'pull_request'.
    if: github.event.inputs.suite != 'smoke'
    # PORT: upstream, replace with the NPU self-hosted runner labels.
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-1' }}
    timeout-minutes: 360
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config mirrors
        run: |
          sed -i 's|ports.ubuntu.com|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          pip config set global.index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          pip config set global.retries 5

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
              git gcc g++ make cmake ninja-build python-is-python3 python3-pip

      - name: Check container state
        run: |
          npu-smi info
          echo "source /usr/local/Ascend/cann/set_env.sh" >> ~/.bashrc

      - name: Install pytorch
        run: |
          pip install torch torch_npu==2.7.1rc1 torchvision \
              numpy==1.* cloudpickle tornado ml-dtypes PyYAML decorator -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

      - name: List torch_npu version
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import torch_npu; print('torch_npu:', torch_npu.__version__)"

      - name: Install transformers
        run: |
          # Install the PyPI release from the configured tuna mirror instead of
          # cloning transformers master: github.com is unreliable from this
          # runner's network, and master has broken this workflow twice
          # (torchaudio import chain, 'embedding_rowwise' tp_plan style).
          pip install transformers

      - name: Checkout deepspeed
        uses: actions/checkout@v4
        with:
          # PORT: upstream, drop this step (the workflow itself is checked out).
          repository: deepspeedai/DeepSpeed
          path: deepspeed

      - name: Install deepspeed
        working-directory: deepspeed
        run: |
          # Install DeepSpeed's dev requirements (test toolchain) straight from the
          # checkout so they never drift from upstream; drop deepspeed-kernels,
          # which only ships x86_64 wheels and fails on aarch64 NPU runners.
          sed '/deepspeed-kernels/d' requirements/requirements-dev.txt > /tmp/requirements-dev-npu.txt
          pip install -r /tmp/requirements-dev-npu.txt
          pip install .[autotuning]
          ds_report

      - name: Run unit tests
        working-directory: deepspeed/tests/unit
        run: |
          unset TORCH_CUDA_ARCH_LIST # only jit compile for current arch

          # test_ds_init.py::test_literal_device hardcodes a device-name whitelist
          # ('xpu'/'cuda'); extend it so the same literal-device check applies on NPU
          sed -i \
            -e "s/string == 'cuda'/string == 'cuda' or string == 'npu'/" \
            -e "s/string0 == 'cuda:0'/string0 == 'cuda:0' or string0 == 'npu:0'/" \
            -e "s/string1 == 'cuda:1'/string1 == 'cuda:1' or string1 == 'npu:1'/" \
            ../accelerator/test_ds_init.py

          # test_ds_init.py passes the literal 'ds_config.json' to deepspeed.initialize,
          # so it must run with cwd = tests/accelerator (no __file__-based path resolution)
          (cd ../accelerator && pytest --verbose .)
          pytest --verbose autotuning
          # TestGPTBigCodeMultiQueryTraining::test_matches_single_device_training hangs on
          # NPU (HCCL collective never completes; added by upstream #8928). Filter out until
          # upstream fixes it, otherwise the nightly run burns the whole job timeout.
          pytest --verbose v1/autotp -k "not test_matches_single_device_training"
          pytest --verbose monitor
          pytest --verbose utils
          pytest --verbose runtime/test_ds_config_model.py
          pytest --verbose runtime/pipe/test_pipe_schedule.py
          pytest --verbose runtime/zero/test_zero_config.py
          pytest --verbose runtime/zero/test_zero_tiled.py
          pytest --verbose runtime/zero/test_zeropp.py
          pytest --verbose runtime/test_autocast.py
          pytest --verbose runtime/test_data.py
          pytest --verbose runtime/zero/test_zero_dynamic_class.py
