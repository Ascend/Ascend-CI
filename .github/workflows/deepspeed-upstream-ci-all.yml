name: deepspeed-upstream-ci-all

# Full DeepSpeed unit suite on Ascend NPU, aligned with the CUDA full CI
# (aws-torch-latest-full.yml, which runs tests/unit/ on 8 GPUs).
#
# This is the deeper nightly canary: deepspeed-upstream-ci.yml stays small for
# pull requests, while this workflow runs the whole tests/unit tree to catch
# regressions outside the curated NPU set. It deliberately does not run on
# pull_request: changing this YAML must not start an 8-NPU multi-hour run.
#
# While staged in Ascend-CI this workflow is manual-only. Upstream, enable the
# nightly schedule below; this is the intended README badge target once the
# baseline is clean:
#
#   on:
#     workflow_dispatch:
#     schedule:
#       - cron: "0 0 * * *"
#
# PORT:
#   1. checkout: replace the Ascend-CI self-checkout + the deepspeedai/DeepSpeed
#      subdir checkout with a single plain `uses: actions/checkout@v4`.
#   2. runs-on: use the labels registered for the NPU runners on deepspeedai/DeepSpeed
#      (e.g. [self-hosted, ascend, npu]) instead of the a2 runner names.
#   3. restore the schedule trigger above.
#
# Scope:
#   - tests/unit only, matching the CUDA full unit workflow. tests/torch_compile
#     is covered by deepspeed-compile.yml, not here.
#   - The ignores below are the same hardware/feature exclusions CUDA full CI
#     uses. Start from these; the first manual baseline run defines the extra
#     NPU-specific ignore/deselect list (CUDA-only kernels, known NPU gaps).
#   - Set audit=true for a one-off complete inventory: it clears pytest.ini's
#     marker filters, drops the known ignores, and reports FAILED/ERROR/SKIPPED
#     for the whole tests/unit tree. This is much slower and noisier than the
#     normal run; keep it manual.
#   - Use `shard` to split that inventory by directory (runtime, v1-core,
#     v1-moe, v1-zero, misc, ops, inference). `all` keeps the single-job run.
#   - Each run writes test-stats.json/txt. Sum passed/failed/skipped across
#     shards to compute NPU pass rates; pass_rate_executed excludes skips, while
#     pass_rate_all counts every collected test.
#   - 360 minutes is GitHub's job cap. If the baseline exceeds it, split the run
#     by test directory into a matrix instead of raising this value.

on:
  workflow_dispatch:
    inputs:
      runner:
        required: true
        type: choice
        options:
          - linux-aarch64-a2-4
          - linux-aarch64-a2-8
        default: 'linux-aarch64-a2-8'
        description: 'Runner to run on (full suite needs at least 4 NPUs; a2-8 recommended)'
      audit:
        required: false
        type: boolean
        default: false
        description: 'Audit mode: clear pytest.ini marker filters, drop known ignores, and report skipped/unsupported tests (slow)'
      shard:
        required: false
        type: choice
        options:
          - all
          - runtime
          - v1-core
          - v1-moe
          - v1-zero
          - misc
          - ops
          - inference
        default: 'all'
        description: 'Directory shard; use one shard per run when a full audit exceeds the 6h job cap'
      parallel:
        required: false
        type: choice
        options:
          - auto
          - '1'
          - '2'
          - '4'
          - '8'
        default: 'auto'
        description: 'xdist workers; auto serializes distributed-heavy shards (runtime/v1-moe/v1-zero)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

jobs:
  all-unit-tests:
    name: deepspeed-upstream-ci-all / unit tests (${{ github.event.inputs.shard || 'all' }})
    # PORT: upstream, replace with the NPU self-hosted runner labels.
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-8' }}
    timeout-minutes: 360
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:latest
    env:
      SELECTED_RUNNER: ${{ github.event.inputs.runner || 'linux-aarch64-a2-8' }}
      AUDIT: ${{ github.event.inputs.audit || 'false' }}
      SHARD: ${{ github.event.inputs.shard || 'all' }}
      PARALLEL: ${{ github.event.inputs.parallel || 'auto' }}
      # HCCL defaults to NPU-side port 16666. Concurrent processes on the same
      # device collide (EI0020: address already bound); let HCCL allocate ports.
      HCCL_NPU_SOCKET_PORT_RANGE: "auto"
      # DeepSpeed's DistributedTest uses this as the per-test child timeout.
      DS_UNITTEST_TIMEOUT: "300"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config mirrors
        run: |
          sed -i 's|ports.ubuntu.com|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          pip config set global.index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          pip config set global.retries 5

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
              git gcc g++ make cmake ninja-build python-is-python3 python3-pip

      - name: Check container state
        run: |
          npu-smi info
          echo "source /usr/local/Ascend/cann/set_env.sh" >> ~/.bashrc

      - name: Expose NPUs from runner label
        run: |
          # The runner image may pre-set ASCEND_RT_VISIBLE_DEVICES=0 for
          # isolation. Derive the count from the a2-N label and override it so
          # torch_npu sees the whole allocation.
          # PORT: upstream, use the target runner's real NPU count instead of
          # parsing an a2-N label (or let the runner set the variable itself).
          NPUS="${SELECTED_RUNNER##*-}"
          if ! [[ "$NPUS" =~ ^[0-9]+$ ]]; then
            NPUS=1
          fi
          DEVICES=$(seq -s, 0 $((NPUS - 1)))
          echo "ASCEND_RT_VISIBLE_DEVICES=$DEVICES" >> "$GITHUB_ENV"
          echo "runner label $SELECTED_RUNNER -> exposing NPUs: $DEVICES"

      - name: Install pytorch
        run: |
          # Match xpu-max1100.yml's torch 2.10 line. torch_npu 2.10.0.post7 is the
          # release paired with torch 2.10.0; torchvision 0.25.0 matches that torch.
          pip install torch==2.10.0 torch_npu==2.10.0.post7 torchvision==0.25.0 \
              numpy==1.* cloudpickle tornado ml-dtypes PyYAML decorator -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

      - name: List torch_npu version
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import torch_npu; print('torch_npu:', torch_npu.__version__)"

      - name: Install transformers
        run: |
          # Install the PyPI release from the configured tuna mirror instead of
          # cloning transformers master: github.com is unreliable from this
          # runner's network, and master has broken this workflow twice
          # (torchaudio import chain, 'embedding_rowwise' tp_plan style).
          pip install transformers

      - name: Checkout deepspeed
        uses: actions/checkout@v4
        with:
          # PORT: upstream, drop this step (the workflow itself is checked out).
          repository: deepspeedai/DeepSpeed
          path: deepspeed

      - name: Install deepspeed
        working-directory: deepspeed
        run: |
          # Install DeepSpeed's dev requirements (test toolchain) straight from the
          # checkout so they never drift from upstream; drop deepspeed-kernels,
          # which only ships x86_64 wheels and fails on aarch64 NPU runners.
          sed '/deepspeed-kernels/d' requirements/requirements-dev.txt > /tmp/requirements-dev-npu.txt
          pip install -r /tmp/requirements-dev-npu.txt
          # requirements-dev.txt does not pin pytest-timeout/pytest-instafail;
          # the full-suite run needs both to survive hangs and report failures early.
          pip install pytest-timeout pytest-instafail
          pip install .[autotuning]
          ds_report

      - name: Check NPU state
        working-directory: deepspeed
        run: |
          python -c "import torch, torch_npu; print('NPU available:', torch.npu.is_available())"
          python -c "from deepspeed.accelerator import get_accelerator; print('accelerator:', get_accelerator()._name)"
          python - <<'PY'
          import os
          import torch
          import torch_npu
          count = torch.npu.device_count()
          audit = os.environ.get('AUDIT') == 'true'
          min_npus = 1 if audit else 4
          print('runner label:', os.environ.get('SELECTED_RUNNER'))
          print('ASCEND_RT_VISIBLE_DEVICES:', os.environ.get('ASCEND_RT_VISIBLE_DEVICES'))
          print('visible NPU count:', count)
          print('audit mode:', audit)
          assert count >= min_npus, (
              f"{'audit' if audit else 'full suite'} needs at least {min_npus} NPUs "
              f"(visible={count}); check 'npu-smi info' and ASCEND_RT_VISIBLE_DEVICES, "
              "and select linux-aarch64-a2-4 or a2-8")
          if count < 8:
              print('::warning::only %d NPUs visible; world_size>%d tests will be skipped' % (count, count))
          PY
          pip list

      - name: Run full unit suite
        working-directory: deepspeed/tests
        run: |
          set -o pipefail
          unset TORCH_CUDA_ARCH_LIST # only jit compile for current arch
          ulimit -n 1048575 || true
          rm -rf /tmp/deepspeed-pytest
          : > "$GITHUB_WORKSPACE/failing-tests.txt"
          : > "$GITHUB_WORKSPACE/skipped-tests.txt"
          : > "$GITHUB_WORKSPACE/all-tests.txt"
          : > /tmp/pytest-full.log

          AUDIT="${AUDIT:-false}"
          SHARD="${SHARD:-all}"
          NPU_COUNT=$(python -c "import torch, torch_npu; print(torch.npu.device_count())")
          echo "Running unit suite with -n $NPU_COUNT on $NPU_COUNT visible NPUs (audit=$AUDIT, shard=$SHARD)"

          TARGETS=(unit/)
          SHARD_IGNORES=()
          case "$SHARD" in
            all) ;;
            runtime) TARGETS=(unit/runtime) ;;
            v1-core)
              TARGETS=(unit/v1)
              SHARD_IGNORES=(--ignore=unit/v1/moe --ignore=unit/v1/zero)
              ;;
            v1-moe) TARGETS=(unit/v1/moe) ;;
            v1-zero) TARGETS=(unit/v1/zero) ;;
            misc)
              TARGETS=(
                unit/checkpoint unit/comm unit/launcher unit/utils unit/linear
                unit/pipe unit/profiling unit/sequence unit/monitor unit/autotuning
                unit/accelerator unit/test_multirank_selection.py
              )
              ;;
            ops) TARGETS=(unit/ops unit/compile) ;;
            inference)
              TARGETS=(unit/inference unit/module_inject unit/hybrid_engine unit/ulysses_alst)
              ;;
            *)
              echo "unknown shard: $SHARD" >&2
              exit 2
              ;;
          esac
          echo "shard $SHARD targets: ${TARGETS[*]}"

          PARALLEL="${PARALLEL:-auto}"
          if [ "$PARALLEL" = "auto" ]; then
            case "$SHARD" in
              # These shards are dominated by DistributedTest: one world_size=4
              # test already uses every NPU on a2-4, so concurrent xdist workers
              # only create overlapping HCCL process groups.
              runtime|v1-moe|v1-zero) PARALLEL=1 ;;
              *) PARALLEL="$NPU_COUNT" ;;
            esac
          fi
          PARALLEL_ARGS=()
          if [ "$PARALLEL" -gt 1 ]; then
            PARALLEL_ARGS=(-n "$PARALLEL")
          fi
          echo "xdist workers: $PARALLEL (visible NPUs: $NPU_COUNT)"

          common=(
            --verbose
            --timeout=300
            --continue-on-collection-errors
            --basetemp=/tmp/deepspeed-pytest
            -rs
            --durations=50
            --durations-min=10
          )

          if [ "$AUDIT" = "true" ]; then
            # Clear pytest.ini's addopts so marker-gated tests (nightly,
            # inference*, stable_diffusion, evaluation) are collected and run.
            common+=(-o addopts=)
            # Inventory every node id before executing, including collection
            # errors, so the audit has a complete denominator.
            pytest --collect-only -q --continue-on-collection-errors -o addopts= \
              "${SHARD_IGNORES[@]}" "${TARGETS[@]}" \
              > "$GITHUB_WORKSPACE/all-tests.txt" 2>&1 || true
          else
            common+=(--instafail)
            # Same exclusions CUDA full CI uses. Add NPU-specific entries here as
            # the baseline run identifies CUDA-only or known-broken tests.
            common+=(
              --ignore=unit/runtime/zero/test_nvme_checkpointing.py
              --ignore=unit/v1/nvme/test_gds.py
              --ignore=unit/launcher/test_user_args.py
              --ignore=unit/runtime/zenflow
              --ignore=unit/ops/adam/test_zf_torch_adam.py
              -k "not test_matches_single_device_training"
            )
          fi

          status=0
          run_phase() {
            label=$1
            shift
            echo "::group::$label"
            pytest "$@" 2>&1 | tee -a /tmp/pytest-full.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              status=1
            fi
            echo "::endgroup::"
          }

          if [ "$AUDIT" = "true" ]; then
            # addopts is cleared above, so partition sequential tests explicitly.
            run_phase "unit tests (parallel)" "${PARALLEL_ARGS[@]}" -m "not sequential" \
              "${common[@]}" "${SHARD_IGNORES[@]}" "${TARGETS[@]}"
            rm -rf /tmp/deepspeed-pytest
            run_phase "unit tests (sequential)" -m sequential \
              "${common[@]}" "${SHARD_IGNORES[@]}" "${TARGETS[@]}"
          else
            run_phase "unit tests (parallel)" "${PARALLEL_ARGS[@]}" \
              "${common[@]}" "${SHARD_IGNORES[@]}" "${TARGETS[@]}"
            rm -rf /tmp/deepspeed-pytest
            run_phase "unit tests (sequential)" -m sequential \
              "${common[@]}" "${SHARD_IGNORES[@]}" "${TARGETS[@]}" \
              --ignore=unit/ops/deepspeed4science/test_DS4Sci_EvoformerAttention.py
          fi

          grep -oE '(FAILED|ERROR) [^[:space:]]+' /tmp/pytest-full.log \
            | sed -E 's/^(FAILED|ERROR) //; s/::.*//' \
            | sort -u > "$GITHUB_WORKSPACE/failing-tests.txt" || true

          # `-rs` prints `SKIPPED [n] path:line: reason`; keep the reason too.
          grep -E '(^|\[gw[0-9]+\] )SKIPPED ' /tmp/pytest-full.log \
            | sed -E 's/^(\[gw[0-9]+\] )?//' \
            | sort -u > "$GITHUB_WORKSPACE/skipped-tests.txt" || true

          # Sum pytest's terminal summary lines across both phases. This is the
          # per-shard source of truth for pass/fail/skip/error counts.
          python - <<'PY'
          import json
          import os
          import re

          text = open('/tmp/pytest-full.log', errors='ignore').read()
          totals = {k: 0 for k in
                    ('passed', 'failed', 'errors', 'skipped', 'xfailed', 'xpassed', 'deselected')}
          summary_lines = 0
          for line in text.splitlines():
              stripped = line.strip()
              if not (stripped.startswith('=') and stripped.endswith('=') and ' in ' in stripped):
                  continue
              summary_lines += 1
              for num, key in re.findall(
                      r'(\d+) (passed|failed|errors?|skipped|xfailed|xpassed|deselected)\b', stripped):
                  if key in ('error', 'errors'):
                      key = 'errors'
                  totals[key] += int(num)

          workspace = os.environ['GITHUB_WORKSPACE']
          all_tests = os.path.join(workspace, 'all-tests.txt')
          collected = 0
          if os.path.exists(all_tests):
              collected = sum(1 for line in open(all_tests, errors='ignore') if '::' in line)

          executed = sum(totals[k] for k in ('passed', 'failed', 'errors', 'xfailed', 'xpassed'))
          strict_executed = totals['passed'] + totals['failed'] + totals['errors']
          skipped = totals['skipped']
          if collected <= 0:
              collected = executed + skipped
          not_run = max(collected - (executed + skipped), 0)
          rate_strict = (totals['passed'] / strict_executed * 100) if strict_executed else 0.0
          rate_executed = (totals['passed'] / executed * 100) if executed else 0.0
          rate_all = (totals['passed'] / collected * 100) if collected else 0.0

          stats = {
              **totals,
              'collected': collected,
              'executed': executed,
              'strict_executed': strict_executed,
              'not_run': not_run,
              'summary_lines': summary_lines,
              'pass_rate_strict_pct': round(rate_strict, 2),
              'pass_rate_executed_pct': round(rate_executed, 2),
              'pass_rate_all_pct': round(rate_all, 2),
          }
          with open(os.path.join(workspace, 'test-stats.json'), 'w') as f:
              json.dump(stats, f, indent=2, sort_keys=True)
              f.write('\n')
          with open(os.path.join(workspace, 'test-stats.txt'), 'w') as f:
              f.write('passed=%d failed=%d errors=%d skipped=%d xfailed=%d xpassed=%d\n' % (
                  totals['passed'], totals['failed'], totals['errors'], skipped,
                  totals['xfailed'], totals['xpassed']))
              f.write('collected=%d executed=%d strict_executed=%d not_run=%d\n' % (
                  collected, executed, strict_executed, not_run))
              f.write('pass_rate_strict=%.2f%% pass_rate_executed=%.2f%% pass_rate_all=%.2f%%\n' % (
                  rate_strict, rate_executed, rate_all))
          print(open(os.path.join(workspace, 'test-stats.txt')).read())
          PY

          collected=0
          if [ -s "$GITHUB_WORKSPACE/all-tests.txt" ]; then
            collected=$(grep -c '::' "$GITHUB_WORKSPACE/all-tests.txt" || true)
          fi

          {
            echo "## deepspeed-upstream-ci-all"
            echo
            echo "- runner: ${SELECTED_RUNNER}"
            echo "- shard: ${SHARD}"
            echo "- xdist workers: ${PARALLEL}"
            echo "- audit mode: ${AUDIT}"
            if [ "$AUDIT" = "true" ]; then
              echo "- collected test nodes: ${collected}"
            fi
            echo "- failing/error files: $(wc -l < "$GITHUB_WORKSPACE/failing-tests.txt")"
            echo "- skipped entries: $(wc -l < "$GITHUB_WORKSPACE/skipped-tests.txt")"
            if [ -s "$GITHUB_WORKSPACE/test-stats.txt" ]; then
              echo
              echo "### Stats"
              sed 's/^/- /' "$GITHUB_WORKSPACE/test-stats.txt"
            fi
            if [ -s "$GITHUB_WORKSPACE/failing-tests.txt" ]; then
              echo
              echo "### Failing/error files"
              head -100 "$GITHUB_WORKSPACE/failing-tests.txt" | sed 's/^/- /'
            fi
            if [ -s "$GITHUB_WORKSPACE/skipped-tests.txt" ]; then
              echo
              echo "### Skipped files"
              head -100 "$GITHUB_WORKSPACE/skipped-tests.txt" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "One or more unit test phases failed."
            exit "$status"
          fi

      - name: Upload test inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-inventories-${{ github.event.inputs.shard || 'all' }}
          path: |
            failing-tests.txt
            skipped-tests.txt
            all-tests.txt
            test-stats.json
            test-stats.txt
          if-no-files-found: ignore
