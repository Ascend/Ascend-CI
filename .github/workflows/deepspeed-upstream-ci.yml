name: deepspeed-upstream-ci

# DeepSpeed NPU pull-request CI, modeled on upstream's xpu-max1100.yml.
#
# This workflow watches the NPU surface only: the NPU accelerator, the torch_npu
# host-registration path, HCCL/comm hooks, NPU op builders, and the NPU-specific
# tests. The CUDA-parity full suite lives in deepspeed-upstream-ci-all.yml; that
# workflow owns the nightly run and is the intended README badge target once its
# baseline is clean.
#
# While staged in Ascend-CI this workflow is manual-only. Upstream, restore the
# trigger block below and select jobs by event:
#
#   on:
#     workflow_dispatch:
#     pull_request:
#       paths:  # mirrors xpu-max1100.yml, plus NPU-specific paths
#         - ".github/workflows/deepspeed-upstream-ci.yml"
#         - "accelerator/npu_accelerator.py"
#         - "accelerator/abstract_accelerator.py"
#         - "accelerator/cpu_accelerator.py"
#         - "accelerator/real_accelerator.py"
#         - "csrc/aio/py_lib/deepspeed_cpu_op.cpp"     # torch_npu host-register path
#         - "deepspeed/comm/comm.py"
#         - "deepspeed/comm/constants.py"
#         - "deepspeed/env_report.py"                # ds_report NPU/CANN reporting
#         - "deepspeed/runtime/engine.py"
#         - "deepspeed/runtime/bf16_optimizer.py"
#         - "deepspeed/runtime/zero/stage_1_and_2.py"
#         - "deepspeed/runtime/zero/stage3.py"
#         - "deepspeed/runtime/zero/partition_parameters.py"
#         - "deepspeed/runtime/zero/partitioned_param_coordinator.py"
#         - "deepspeed/runtime/zero/parameter_offload.py"
#         - "deepspeed/runtime/pipe/engine.py"
#         - "deepspeed/runtime/utils.py"
#         - "op_builder/npu/**"
#         - "tests/unit/accelerator/**"
#         - "tests/unit/ops/quantizer/**"
#         - "tests/unit/v1/pin_memory/**"
#         - "tests/accelerator/**"
#
# The job conditions below already handle both staging and upstream:
#   pr-unit-tests: pull_request, or dispatch with suite=smoke
#   unit-tests:    non-PR dispatch with suite=full
#
# PORT:
#   1. checkout: replace the Ascend-CI self-checkout + the deepspeedai/DeepSpeed
#      subdir checkout with a single plain `uses: actions/checkout@v4`.
#   2. runs-on: use the labels registered for the NPU runners on deepspeedai/DeepSpeed
#      (e.g. [self-hosted, ascend, npu]) instead of the a2 runner names.
#   3. apply the trigger block above. Do not add a schedule here:
#      deepspeed-upstream-ci-all.yml runs the nightly full suite.
#
# Design:
#   - The pytest targets mirror xpu-max1100.yml. NPU-only additions: the legacy
#     device-literal check (tests/accelerator), the NPU quantizer test, and the
#     NPU pinned-memory tests.
#   - PR runs are non-blocking (continue-on-error only when the event is a PR) and
#     execute a small smoke subset with a short timeout, so PR merges are never held
#     up by NPU jobs.
#   - The manual `unit-tests` job executes the full curated NPU set. It is not
#     continue-on-error, so a failing manual run is visible. The nightly full
#     CUDA-parity suite is a separate workflow.

on:
  workflow_dispatch:
    inputs:
      runner:
        required: true
        type: choice
        options:
          - linux-aarch64-a2-1
          - linux-aarch64-a2-2
          - linux-aarch64-a2-4
          - linux-aarch64-a2-8
        default: 'linux-aarch64-a2-1'
        description: 'Runner to run on (smoke: a2-1+; full: a2-4+ for world_size=4 tests)'
      suite:
        required: true
        type: choice
        options:
          - full
          - smoke
        default: 'full'
        description: 'Suite to run: full (curated NPU set) or smoke (PR subset)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

jobs:
  pr-unit-tests:
    name: deepspeed-upstream-ci / pr unit tests
    # PR events always run the smoke subset; manual dispatch can select it too.
    if: github.event_name == 'pull_request' || github.event.inputs.suite == 'smoke'
    # PORT: upstream, replace with the NPU self-hosted runner labels.
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-1' }}
    env:
      SELECTED_RUNNER: ${{ github.event.inputs.runner || 'linux-aarch64-a2-1' }}
    # NPU jobs must never block PR merges: failures are reported, not enforced.
    # Only relax the gate for PR runs; manual dispatch must surface failures.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config mirrors
        run: |
          sed -i 's|ports.ubuntu.com|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          pip config set global.index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          pip config set global.retries 5

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
              git gcc g++ make cmake ninja-build python-is-python3 python3-pip

      - name: Check container state
        run: |
          npu-smi info
          echo "source /usr/local/Ascend/cann/set_env.sh" >> ~/.bashrc

      - name: Expose NPUs from runner label
        run: |
          # The runner image may pre-set ASCEND_RT_VISIBLE_DEVICES=0 for
          # isolation. Derive the count from the a2-N label and override it so
          # torch_npu sees the whole allocation.
          # PORT: upstream, use the target runner's real NPU count instead of
          # parsing an a2-N label (or let the runner set the variable itself).
          NPUS="${SELECTED_RUNNER##*-}"
          if ! [[ "$NPUS" =~ ^[0-9]+$ ]]; then
            NPUS=1
          fi
          DEVICES=$(seq -s, 0 $((NPUS - 1)))
          echo "ASCEND_RT_VISIBLE_DEVICES=$DEVICES" >> "$GITHUB_ENV"
          echo "runner label $SELECTED_RUNNER -> exposing NPUs: $DEVICES"

      - name: Install pytorch
        run: |
          # Match xpu-max1100.yml's torch 2.10 line. torch_npu 2.10.0.post7 is the
          # release paired with torch 2.10.0; torchvision 0.25.0 matches that torch.
          pip install torch==2.10.0 torch_npu==2.10.0.post7 torchvision==0.25.0 \
              numpy==1.* cloudpickle tornado ml-dtypes PyYAML decorator -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

      - name: List torch_npu version
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import torch_npu; print('torch_npu:', torch_npu.__version__)"

      - name: Install transformers
        run: |
          # Install the PyPI release from the configured tuna mirror instead of
          # cloning transformers master: github.com is unreliable from this
          # runner's network, and master has broken this workflow twice
          # (torchaudio import chain, 'embedding_rowwise' tp_plan style).
          pip install transformers

      - name: Checkout deepspeed
        uses: actions/checkout@v4
        with:
          # PORT: upstream, drop this step (the workflow itself is checked out).
          repository: deepspeedai/DeepSpeed
          path: deepspeed

      - name: Install deepspeed
        working-directory: deepspeed
        run: |
          # Install DeepSpeed's dev requirements (test toolchain) straight from the
          # checkout so they never drift from upstream; drop deepspeed-kernels,
          # which only ships x86_64 wheels and fails on aarch64 NPU runners.
          sed '/deepspeed-kernels/d' requirements/requirements-dev.txt > /tmp/requirements-dev-npu.txt
          pip install -r /tmp/requirements-dev-npu.txt
          pip install .[autotuning]
          ds_report

      - name: Check NPU state
        working-directory: deepspeed
        run: |
          python -c "import torch, torch_npu; print('NPU available:', torch.npu.is_available())"
          python -c "from deepspeed.accelerator import get_accelerator; print('accelerator:', get_accelerator()._name)"
          python -c "import os; print('ASCEND_RT_VISIBLE_DEVICES:', os.environ.get('ASCEND_RT_VISIBLE_DEVICES'))"
          pip list

      - name: Run PR smoke unit tests
        working-directory: deepspeed/tests/unit
        run: |
          unset TORCH_CUDA_ARCH_LIST # only jit compile for current arch

          # test_ds_init.py::test_literal_device hardcodes a device-name whitelist
          # ('xpu'/'cuda'); extend it so the same literal-device check applies on NPU
          sed -i \
            -e "s/string == 'cuda'/string == 'cuda' or string == 'npu'/" \
            -e "s/string0 == 'cuda:0'/string0 == 'cuda:0' or string0 == 'npu:0'/" \
            -e "s/string1 == 'cuda:1'/string1 == 'cuda:1' or string1 == 'npu:1'/" \
            ../accelerator/test_ds_init.py

          # Match xpu-max1100.yml's accelerator target (tests/unit/accelerator).
          pytest --verbose accelerator/*

          # NPU-specific: the legacy literal-device check lives in tests/accelerator.
          # It passes the literal 'ds_config.json' to deepspeed.initialize, so it
          # must run with cwd = tests/accelerator (no __file__-based path resolution).
          (cd ../accelerator && pytest --verbose .)
          pytest --verbose utils
          # NPU-only unit tests. The quantizer test is not in every checkout yet.
          if [ -f ops/quantizer/test_npu_quantizer.py ]; then
            pytest --verbose ops/quantizer/test_npu_quantizer.py
          else
            echo "::notice::ops/quantizer/test_npu_quantizer.py not present; skipping"
          fi
          pytest --verbose v1/pin_memory/test_pin_memory.py
          pytest --verbose runtime/test_ds_config_model.py
          pytest --verbose runtime/zero/test_zero_config.py
          pytest --verbose runtime/test_data.py

  unit-tests:
    name: deepspeed-upstream-ci / npu unit tests
    # Manual dispatch with suite=full (the default). PR events never run this job.
    if: github.event_name != 'pull_request' && github.event.inputs.suite != 'smoke'
    # PORT: upstream, replace with the NPU self-hosted runner labels.
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-1' }}
    env:
      SELECTED_RUNNER: ${{ github.event.inputs.runner || 'linux-aarch64-a2-1' }}
    timeout-minutes: 360
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config mirrors
        run: |
          sed -i 's|ports.ubuntu.com|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          pip config set global.index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          pip config set global.retries 5

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
              git gcc g++ make cmake ninja-build python-is-python3 python3-pip

      - name: Check container state
        run: |
          npu-smi info
          echo "source /usr/local/Ascend/cann/set_env.sh" >> ~/.bashrc

      - name: Expose NPUs from runner label
        run: |
          # The runner image may pre-set ASCEND_RT_VISIBLE_DEVICES=0 for
          # isolation. Derive the count from the a2-N label and override it so
          # torch_npu sees the whole allocation.
          # PORT: upstream, use the target runner's real NPU count instead of
          # parsing an a2-N label (or let the runner set the variable itself).
          NPUS="${SELECTED_RUNNER##*-}"
          if ! [[ "$NPUS" =~ ^[0-9]+$ ]]; then
            NPUS=1
          fi
          DEVICES=$(seq -s, 0 $((NPUS - 1)))
          echo "ASCEND_RT_VISIBLE_DEVICES=$DEVICES" >> "$GITHUB_ENV"
          echo "runner label $SELECTED_RUNNER -> exposing NPUs: $DEVICES"

      - name: Install pytorch
        run: |
          # Match xpu-max1100.yml's torch 2.10 line. torch_npu 2.10.0.post7 is the
          # release paired with torch 2.10.0; torchvision 0.25.0 matches that torch.
          pip install torch==2.10.0 torch_npu==2.10.0.post7 torchvision==0.25.0 \
              numpy==1.* cloudpickle tornado ml-dtypes PyYAML decorator -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

      - name: List torch_npu version
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import torch_npu; print('torch_npu:', torch_npu.__version__)"

      - name: Install transformers
        run: |
          # Install the PyPI release from the configured tuna mirror instead of
          # cloning transformers master: github.com is unreliable from this
          # runner's network, and master has broken this workflow twice
          # (torchaudio import chain, 'embedding_rowwise' tp_plan style).
          pip install transformers

      - name: Checkout deepspeed
        uses: actions/checkout@v4
        with:
          # PORT: upstream, drop this step (the workflow itself is checked out).
          repository: deepspeedai/DeepSpeed
          path: deepspeed

      - name: Install deepspeed
        working-directory: deepspeed
        run: |
          # Install DeepSpeed's dev requirements (test toolchain) straight from the
          # checkout so they never drift from upstream; drop deepspeed-kernels,
          # which only ships x86_64 wheels and fails on aarch64 NPU runners.
          sed '/deepspeed-kernels/d' requirements/requirements-dev.txt > /tmp/requirements-dev-npu.txt
          pip install -r /tmp/requirements-dev-npu.txt
          pip install .[autotuning]
          ds_report

      - name: Check NPU state
        working-directory: deepspeed
        run: |
          python -c "import torch, torch_npu; print('NPU available:', torch.npu.is_available())"
          python -c "from deepspeed.accelerator import get_accelerator; print('accelerator:', get_accelerator()._name)"
          python - <<'PY'
          import os
          import torch
          import torch_npu
          count = torch.npu.device_count()
          print('runner label:', os.environ.get('SELECTED_RUNNER'))
          print('ASCEND_RT_VISIBLE_DEVICES:', os.environ.get('ASCEND_RT_VISIBLE_DEVICES'))
          print('visible NPU count:', count)
          if count < 4:
              print('::warning::full suite has world_size=4 tests; select linux-aarch64-a2-4 or larger to run them')
          PY
          pip list

      - name: Run unit tests
        working-directory: deepspeed/tests/unit
        run: |
          unset TORCH_CUDA_ARCH_LIST # only jit compile for current arch

          # test_ds_init.py::test_literal_device hardcodes a device-name whitelist
          # ('xpu'/'cuda'); extend it so the same literal-device check applies on NPU
          sed -i \
            -e "s/string == 'cuda'/string == 'cuda' or string == 'npu'/" \
            -e "s/string0 == 'cuda:0'/string0 == 'cuda:0' or string0 == 'npu:0'/" \
            -e "s/string1 == 'cuda:1'/string1 == 'cuda:1' or string1 == 'npu:1'/" \
            ../accelerator/test_ds_init.py

          # Match xpu-max1100.yml's accelerator target (tests/unit/accelerator).
          # The manual NPU set runs every group even after a failure, so triage can
          # report all failing targets in one issue.
          status=0
          run() {
            echo "::group::$*"
            "$@" || status=1
            echo "::endgroup::"
          }

          run pytest --verbose accelerator/*

          # NPU-specific: the legacy literal-device check lives in tests/accelerator.
          # It passes the literal 'ds_config.json' to deepspeed.initialize, so it
          # must run with cwd = tests/accelerator (no __file__-based path resolution).
          (cd ../accelerator && pytest --verbose .) || status=1

          run pytest --verbose autotuning
          # TestGPTBigCodeMultiQueryTraining::test_matches_single_device_training hangs on
          # NPU (HCCL collective never completes; added by upstream #8928). Filter out until
          # upstream fixes it, otherwise the run burns the whole job timeout.
          run pytest --verbose v1/autotp -k "not test_matches_single_device_training"
          run pytest --verbose monitor
          run pytest --verbose utils
          # NPU-only unit tests. The quantizer test is not in every checkout yet.
          if [ -f ops/quantizer/test_npu_quantizer.py ]; then
            run pytest --verbose ops/quantizer/test_npu_quantizer.py
          else
            echo "::notice::ops/quantizer/test_npu_quantizer.py not present; skipping"
          fi
          run pytest --verbose v1/pin_memory/test_pin_memory.py
          run pytest --verbose runtime/test_ds_config_model.py
          run pytest --verbose runtime/pipe/test_pipe_schedule.py
          run pytest --verbose runtime/zero/test_zero_config.py
          run pytest --verbose runtime/zero/test_zero_tiled.py
          run pytest --verbose runtime/zero/test_zeropp.py
          run pytest --verbose runtime/test_autocast.py
          run pytest --verbose runtime/test_data.py
          run pytest --verbose runtime/zero/test_zero_dynamic_class.py

          if [ "$status" -ne 0 ]; then
            echo "One or more test groups failed."
            exit "$status"
          fi
