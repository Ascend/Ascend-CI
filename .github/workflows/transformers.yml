name: Transformers test on Ascend NPU

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/transformers.yml"
  pull_request:
    paths:
      - ".github/workflows/transformers.yml"
  workflow_dispatch:
    inputs:
      runner:
        required: true
        type: choice
        options:
          - linux-aarch64-a2-1
          - linux-aarch64-a2-2
          - linux-aarch64-a2-4
          - linux-aarch64-a2-8
        default: "linux-aarch64-a2-2"
        description: "The runner selected to run on"
  schedule:
    - cron: "0 21 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ${{ github.event.inputs.runner || 'linux-aarch64-a2-2' }}
    env:
      HF_ENDPOINT: https://hf-mirror.com
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Checkout Transformers
      uses: actions/checkout@v6
      with:
        repository: huggingface/transformers
        ref: main
        path: transformers
        fetch-depth: 1

    - name: Set up Python
      run: |
        # Python should be pre-installed in the container image
        python --version

    - name: Verify NPU availability
      run: |
        npu-smi info
        echo "NPU devices available"
        ls -l $ASCEND_TOOLKIT_HOME
        ls -l $ASCEND_TOOLKIT_HOME/toolkit
        cat $ASCEND_TOOLKIT_HOME/toolkit/version.info || true

    - name: Install Transformers test dependencies
      working-directory: transformers
      run: |
        pip install -e ".[testing]"
        pip install librosa

    - name: Install torch_npu
      shell: bash
      run: |
        PYTORCH_CPU_INDEX=https://download.pytorch.org/whl/cpu
        # torchcodec has Linux aarch64 wheels from 0.13 onward (requires torch >= 2.11).
        pip install \
          torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 torchcodec==0.13.0 \
          --index-url "${PYTORCH_CPU_INDEX}"
        pip install torch_npu==2.11.0.post2
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg espeak-ng
        pip install phonemizer
        # Triton 3.6 still ships triton_key in triton.runtime.cache. torch_npu
        # imports it from triton.compiler.compiler and only catches
        # ModuleNotFoundError; the pytest plugin re-exports it.
        pip install triton==3.6.0 "triton-ascend==3.6.0" \
          --extra-index-url https://triton-ascend.osinfra.cn/pypi/simple
        # triton-ascend pins numpy==1.26.4, and its scipy==1.13.1 accepts
        # numpy<2.3. pyarrow and opencv need NumPy 2. pandas 2.2.x is for
        # ms-service-profiler. pytest plugins need pytest>=8.4.
        pip install "numpy>=2,<2.3" "pandas~=2.2" "pytest>=8.4.2,<9"
        python3 -c "import numpy, pyarrow; from triton.runtime.cache import triton_key; assert int(numpy.__version__.split('.')[0]) >= 2, numpy.__version__; print('numpy', numpy.__version__, 'pyarrow', pyarrow.__version__, 'triton_key', triton_key.__name__)"
        python3 -c "import torch; import torch_npu; print('npu available:', torch_npu.npu.is_available())"
        python3 -c "import torchcodec; import phonemizer; print('torchcodec and phonemizer import ok')"

    - name: List Python Environments
      run: pip list

    - name: Run Unit Tests
      shell: bash
      working-directory: transformers
      env:
        TRANSFORMERS_TEST_DEVICE: npu
        RUNNER_LABEL: ${{ github.event.inputs.runner || 'linux-aarch64-a2-2' }}
      run: |
        NPUS="${RUNNER_LABEL##*-}"
        [[ "$NPUS" =~ ^[0-9]+$ ]] || NPUS=2
        export ASCEND_RT_VISIBLE_DEVICES="$(python3 -c "print(','.join(map(str, range($NPUS))))")"
        # xdist workers stay up. Drop a leftover default process group so the
        # next test does not hit "trying to initialize the default process group twice".
        printf '%s\n' \
          'import os' \
          'import pytest' \
          '_worker = os.environ.get("PYTEST_XDIST_WORKER")' \
          'if _worker and _worker.startswith("gw"):' \
          '    os.environ["ASCEND_RT_VISIBLE_DEVICES"] = _worker[2:]' \
          'def _export_triton_key():' \
          '    try:' \
          '        import triton.compiler.compiler as compiler' \
          '        if not hasattr(compiler, "triton_key"):' \
          '            from triton.runtime.cache import triton_key' \
          '            compiler.triton_key = triton_key' \
          '    except Exception:' \
          '        return' \
          'def _destroy_default_process_group():' \
          '    try:' \
          '        import torch.distributed as dist' \
          '        if dist.is_available() and dist.is_initialized():' \
          '            dist.destroy_process_group()' \
          '    except Exception:' \
          '        return' \
          '_export_triton_key()' \
          '@pytest.hookimpl(hookwrapper=True, tryfirst=True)' \
          'def pytest_runtest_setup(item):' \
          '    _destroy_default_process_group()' \
          '    yield' \
          '@pytest.hookimpl(hookwrapper=True, trylast=True)' \
          'def pytest_runtest_teardown(item):' \
          '    yield' \
          '    _destroy_default_process_group()' \
          > /tmp/transformers_npu_xdist.py
        export PYTHONPATH=/tmp${PYTHONPATH:+:$PYTHONPATH}
        XDIST=()
        if [ "$NPUS" -gt 1 ]; then
          XDIST=(-n "$NPUS" --dist load)
        fi
        source "${ASCEND_TOOLKIT_HOME}/set_env.sh"
        python -m pytest "${XDIST[@]}" -p transformers_npu_xdist tests \
          --ignore=tests/conftest_tests \
          --ignore=tests/fixtures \
          --ignore=tests/quantization \
          --ignore=tests/sagemaker \
          --ignore=tests/kernels \
          --ignore=tests/pipeline_parallel \
          --ignore=tests/pipelines \
          --ignore=tests/models \
          --ignore=tests/generation \
          --ignore=tests/tensor_parallel \
          --ignore=tests/test_backbone_common.py \
          --ignore=tests/test_configuration_common.py \
          --ignore=tests/test_executorch.py \
          --ignore=tests/test_feature_extraction_common.py \
          --ignore=tests/test_fsdp_mixin.py \
          --ignore=tests/test_image_processing_common.py \
          --ignore=tests/test_modeling_common.py \
          --ignore=tests/test_pipeline_mixin.py \
          --ignore=tests/test_processing_common.py \
          --ignore=tests/test_sentencepiece_backend_mixin.py \
          --ignore=tests/test_sequence_feature_extraction_common.py \
          --ignore=tests/test_tensor_parallel_mixin.py \
          --ignore=tests/test_training_mixin.py \
          --ignore=tests/test_video_processing_common.py \
          --deselect=tests/cli/test_serve.py::TestProcessorInputsFromMessages::test_multimodal_base64_input_audio_converted_to_data_uri \
          --deselect=tests/exporters/test_utils.py::AutoHfExporterTest::test_from_config_dispatches_dynamo \
          --deselect=tests/integrations/test_moe.py::GroupedMmFallbackCompileTest::test_forward_backward_fullgraph \
          --deselect=tests/repo_utils/test_check_mic.py::CheckMicTest::test_progress_counts_contracts_and_beats_while_the_runner_is_quiet \
          --deselect=tests/repo_utils/test_check_mic.py::CheckMicTest::test_runner_crash_is_not_hidden_by_the_missing_baseline_rerun \
          --deselect=tests/repo_utils/test_check_mic.py::CheckMicTest::test_runner_crash_shows_raw_tail \
          --deselect=tests/repo_utils/test_checkers.py::InPlaceLineTest::test_captured_output_keeps_only_the_last_redraw \
          --deselect=tests/test_tokenization_mistral_common.py::TestMistralCommonBackend:: \
          --deselect=tests/trainer/distributed/test_trainer_distributed_fsdp.py::TestTrainerDistributedFSDP::test_torchrun_accelerate_fsdp1_env_parity \
          --deselect=tests/trainer/distributed/test_trainer_distributed_fsdp.py::TestTrainerDistributedFSDP::test_torchrun_accelerate_fsdp2_env_parity \
          --deselect=tests/trainer/test_trainer.py::TrainerMixedPrecisionTest::test_mixed_fp16 \
          --deselect=tests/trainer/test_trainer.py::TrainerTorchCompileTest::test_torch_compile_eval \
          --deselect=tests/trainer/test_trainer.py::TrainerTorchCompileTest::test_torch_compile_loss_func_compatibility \
          --deselect=tests/trainer/test_trainer.py::TrainerTorchCompileTest::test_torch_compile_train \
          --deselect=tests/trainer/test_trainer_checkpointing.py::TrainerBestModelTest::test_load_best_model_with_save \
          --deselect=tests/trainer/test_trainer_checkpointing.py::TrainerBestModelTest::test_load_best_model_with_save_best \
          --deselect=tests/trainer/test_trainer_seq2seq.py::TestTranslationExample::test_run_seq2seq_ddp \
          --deselect=tests/utils/test_cache_utils.py::CacheIntegrationTest::test_quantized_cache_generation_2_fp8 \
          --deselect=tests/utils/test_cache_utils.py::CacheTest::test_chunked_prefill_slices_per_token_types \
          --deselect=tests/utils/test_cache_utils.py::CacheTest::test_offloaded_cache_prefetches_across_linear_attention_layers \
          --deselect=tests/utils/test_core_model_loading.py::TestConvertAndLoadStateDict::test_qkv_chunk_rope_permute_with_fp8_quantization \
          --deselect=tests/utils/test_deprecation.py::DeprecationDecoratorTester::test_compile_safe \
          --deselect=tests/utils/test_distributed_sharding_utils.py::TestDtensorShardOperation::test_1D_strided_shard \
          --deselect=tests/utils/test_distributed_sharding_utils.py::TestDtensorShardOperation::test_2D_strided_shard_different_dims \
          --deselect=tests/utils/test_distributed_sharding_utils.py::TestDtensorShardOperation::test_2D_strided_shard_same_dim \
          --deselect=tests/utils/test_hub_utils.py::GetFromCacheTests::test_has_file \
          --deselect=tests/utils/test_hub_utils.py::GetFromCacheTests::test_has_file_gated_repo \
          --deselect=tests/utils/test_image_utils.py::LoadImageTester::test_load_img_url_timeout \
          --deselect=tests/utils/test_import_utils.py::test_availability_helpers_are_compile_safe \
          --deselect=tests/utils/test_masking_utils.py::MaskTest::test_bidirectional_mask_cudagraphs \
          --deselect=tests/utils/test_masking_utils.py::MaskTest::test_nonpacked_sequence_mask_skip \
          --deselect=tests/utils/test_masking_utils.py::MaskTest::test_packed_sequence_mask_flex_attention \
          --deselect=tests/utils/test_modeling_rope_utils.py::RopeTest::test_dynamic_rope_resets_after_long_sequence_nested_0 \
          --deselect=tests/utils/test_modeling_rope_utils.py::RopeTest::test_dynamic_rope_resets_after_long_sequence_nested_1 \
          --deselect=tests/utils/test_modeling_rope_utils.py::RopeTest::test_longrope_rope_numerically \
          --deselect=tests/utils/test_modeling_rope_utils.py::RopeTest::test_longrope_rope_numerically_nested_0 \
          --deselect=tests/utils/test_modeling_rope_utils.py::RopeTest::test_longrope_rope_numerically_nested_1 \
          --deselect=tests/utils/test_modeling_utils.py::GradientCheckpointingOffloadTest::test_frees_exactly_the_saved_activations \
          --deselect=tests/utils/test_modeling_utils.py::ModelUtilsTest::test_decoder_only_model_can_be_used_as_encoder
